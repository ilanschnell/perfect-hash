name: test perfect-hash

on: [push]

jobs:
  test:
    name: Self Test and Examples on Python 3.7
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"

      - run: make test

      - name: Build and test wheel
        run: |
          pipx run build --wheel
          wheel_path=$(realpath dist/*-py3-none-any.whl)
          cd "$(mktemp -d)"
          python -m pip install "$wheel_path"
          perfect-hash --version
