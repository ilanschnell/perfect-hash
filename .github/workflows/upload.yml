name: Test, build, and upload to PyPI

on: [push]

jobs:
  test-python37:
    name: Self tests on Python 3.7
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"

      - run: make test

  dists:
    name: Test dists on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build distributions
        run: pipx run build

      - name: Test distributions
        shell: bash
        run: |
          wheel_path=$(realpath dist/*-py3-none-any.whl)
          sdist_path=$(realpath dist/*.tar.gz)
          keys_path=$(realpath animals.txt)
          cd "$(mktemp -d)"

          python -m pip install "$wheel_path"
          perfect-hash --version
          perfect-hash --execute "$keys_path"

          python -m pip install --force-reinstall "$sdist_path"
          perfect-hash --version
          perfect-hash --execute "$keys_path"

  upload:
    name: Upload source distribution and universal wheel
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-python37, dists]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Build distributions
        run: pipx run build

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
